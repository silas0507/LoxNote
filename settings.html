
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - LoxNote</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="settings-container">
    <!-- 左侧 Tab 导航 -->
    <div id="settings-sidebar">
      <div class="tab-item active" data-tab="shortcuts">快捷键</div>
      <div class="tab-item" data-tab="appearance">外观</div>
      <div class="tab-item" data-tab="general">通用</div>
      <div class="tab-item" data-tab="about">关于</div>
    </div>

    <!-- 右侧内容区 -->
    <div id="settings-content">
      <!-- 快捷键设置 -->
      <div id="tab-shortcuts" class="tab-panel active">
        <h2>快捷键设置</h2>
        <p class="tab-desc">点击输入框后按下你想设置的快捷键组合</p>
        
        <div class="setting-group">
          <div class="setting-row">
            <label>显示 / 隐藏窗口</label>
            <input type="text" id="shortcut-toggle" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="toggle">重置</button>
          </div>
          <div class="setting-row">
            <label>窗口置顶</label>
            <input type="text" id="shortcut-alwaysOnTop" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="alwaysOnTop">重置</button>
          </div>
          <div class="setting-row">
            <label>新建笔记</label>
            <input type="text" id="shortcut-newNote" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="newNote">重置</button>
          </div>
          <div class="setting-row">
            <label>保存笔记</label>
            <input type="text" id="shortcut-save" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="save">重置</button>
          </div>
          <div class="setting-row">
            <label>查找</label>
            <input type="text" id="shortcut-find" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="find">重置</button>
          </div>
          <div class="setting-row">
            <label>折叠/展开侧边栏</label>
            <input type="text" id="shortcut-toggleSidebar" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="toggleSidebar">重置</button>
          </div>
          <div class="setting-row">
            <label>增加透明度</label>
            <input type="text" id="shortcut-increaseOpacity" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="increaseOpacity">重置</button>
          </div>
          <div class="setting-row">
            <label>减少透明度</label>
            <input type="text" id="shortcut-decreaseOpacity" class="shortcut-input" readonly>
            <button class="btn-reset" data-key="decreaseOpacity">重置</button>
          </div>
        </div>
      </div>

      <!-- 外观设置 -->
      <div id="tab-appearance" class="tab-panel">
        <h2>外观设置</h2>
        
        <div class="setting-group">
          <div class="setting-row">
            <label>主题</label>
            <select id="theme-select">
              <option value="light">亮色主题</option>
              <option value="dark">暗黑主题</option>
            </select>
          </div>
          <div class="setting-row">
            <label>窗口透明度</label>
            <div class="slider-container">
              <input type="range" id="opacity-slider" min="20" max="100" value="100" step="5">
              <span id="opacity-value">100%</span>
            </div>
          </div>
          <div class="setting-row">
            <label>窗口置顶</label>
            <label class="switch">
              <input type="checkbox" id="always-on-top">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label>字体大小</label>
            <div class="font-size-control">
              <button id="font-decrease" class="btn-small">-</button>
              <span id="font-size-display">14px</span>
              <button id="font-increase" class="btn-small">+</button>
            </div>
          </div>
          <div class="setting-row">
            <label>自动换行</label>
            <label class="switch">
              <input type="checkbox" id="word-wrap" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- 通用设置 -->
      <div id="tab-general" class="tab-panel">
        <h2>通用设置</h2>
        
        <div class="setting-group">
          <div class="setting-row">
            <label>语言</label>
            <select id="language-select">
              <option value="zh-CN">中文</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="setting-row">
            <label>关闭窗口时</label>
            <select id="close-behavior">
              <option value="minimize">最小化到托盘</option>
              <option value="quit">直接退出</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 关于 -->
      <div id="tab-about" class="tab-panel">
        <h2>关于 LoxNote</h2>
        <div class="about-content">
          <p class="version">版本 1.0.0</p>
          <p>一个轻量纯文本记事本。</p>
          <p>基于 Electron + 原生 HTML/CSS/JavaScript 构建。</p>
        </div>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
